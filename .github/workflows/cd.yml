name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Push and Verify Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || exit 1
          test -n "$DOCKERHUB_TOKEN" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          test -n "$JWT_SECRET" || exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } > .env

      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend is responding"

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Record published images
        run: |
          {
            echo "## Docker Hub publication"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
